<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Curator | Sign In</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Fonts -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                "secondary": "#00687a",

                "inverse-primary": "#c3c0ff",

                "secondary-fixed": "#acedff",
                "inverse-surface": "#2e3132",
                "surface-dim": "#d9dadb",
                "on-secondary-container": "#006172",
                "on-background": "#191c1d",
                "on-primary": "#ffffff",
                "surface-container-high": "#e7e8e9",
                "on-secondary-fixed": "#001f26",
                "surface-tint": "#4d44e3",
                "on-tertiary-container": "#ffd4a4",
                "surface-bright": "#f8f9fa",
                "on-primary-fixed-variant": "#3323cc",
                "surface": "#f8f9fa",
                "tertiary-container": "#885500",
                "on-tertiary-fixed": "#2a1700",
                "on-primary-container": "#dad7ff",
                "surface-container-low": "#f3f4f5",
                "background": "#f8f9fa",
                "on-error": "#ffffff",
                "secondary-fixed-dim": "#4cd7f6",
                "surface-container": "#edeeef",
                "error-container": "#ffdad6",
                "surface-container-highest": "#e1e3e4",
                "surface-container-lowest": "#ffffff",
                "secondary-container": "#57dffe",
                "on-tertiary": "#ffffff",
                "primary-container": "#4f46e5",
                "on-surface-variant": "#464555",
                "inverse-on-surface": "#f0f1f2",
                "outline-variant": "#c7c4d8",
                "tertiary-fixed": "#ffddb8",
                "error": "#ba1a1a",
                "tertiary": "#684000",
                "outline": "#777587",
                "on-primary-fixed": "#0f0069",
                "on-error-container": "#93000a"
              },
              fontFamily: {
                "headline": ["Plus Jakarta Sans"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .bg-login-gradient {
            background: radial-gradient(circle at 0% 0%, rgba(53, 37, 205, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(0, 104, 122, 0.05) 0%, transparent 50%);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #3525cd 0%, #4f46e5 100%);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex items-center justify-center p-6 bg-login-gradient">
<!-- Suppression of Nav Shell as per Destination Rule (Transactional Page) -->
<main class="w-full max-w-md">
<!-- Brand Identity Header -->
<div class="text-center mb-10">
<h1 class="font-headline text-4xl font-black text-primary tracking-tight mb-2">Curator</h1>
<p class="text-on-surface-variant font-medium">The Digital Gallery</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0_32px_64px_-12px_rgba(25,28,29,0.04)] transition-all duration-300">
<div class="mb-8">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-1">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Please enter your details to sign in</p>
</div>
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold tracking-widest text-on-surface-variant" for="email">EMAIL ADDRESS</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label text-xs font-bold tracking-widest text-on-surface-variant" for="password">PASSWORD</label>
<a class="text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me (Optional but Standard) -->
<div class="flex items-center gap-3">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="text-sm text-on-surface-variant" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Primary CTA -->
<button class="w-full btn-gradient text-on-primary font-semibold py-4 px-6 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/10" type="submit">
                    Sign in to Curator
                </button>
</form>
<!-- Secondary Options -->
<div class="mt-8 pt-8 border-t border-surface-container">
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 px-4 rounded-xl hover:bg-surface-variant transition-colors group">
<img alt="" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDxjBc4SethgSW98z8wbdP8InABI6C-OlZKjz5gDYacceZ8qbrH2IxS9OvqGXruxo6Ci-_uPKmOzmtj_g-FS26El2lD_8Lu8X7QWlggNuh8QjXktbGEOFAe0kL6WOfLL8yZQ7gOKib1qUexXcJWCsjgpZGCXOZTGP2DzFj4BUQ3_2NSx1MnxqjWQcw2DhsmPXydrlffo1Mrd_BjgOkePiIrF6gRl4S0gKXu-1Q95VWu6RAy_rgrqwQnnU3QEPoG2rtTROqE3yDbZw"/>
<span class="text-sm font-semibold text-on-surface-variant">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 px-4 rounded-xl hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">ios</span>
<span class="text-sm font-semibold text-on-surface-variant">Apple</span>
</button>
</div>
</div>
</div>
<!-- Footer Link -->
<p class="text-center mt-8 text-on-surface-variant text-sm">
            Don't have an account? 
            <a class="font-bold text-primary hover:underline underline-offset-4 decoration-2 transition-all" href="#">Sign up for free</a>
</p>
</main>
<!-- Background Decorative Elements (Editorial Feel) -->
<div class="fixed top-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-20 -right-20 w-80 h-80 bg-secondary/5 rounded-full blur-3xl -z-10"></div>
</body></html>
